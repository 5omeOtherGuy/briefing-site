name: gate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  # PR runs share a group per PR and cancel superseded ones; every push run
  # gets its own group, so no push run is cancelled or replaced while pending.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One leg per Python version; its checks are `python (3.10)` and `python (3.14)`.
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # oldest Python with security support, and the newest stable release
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Gate
        run: scripts/gate

  # The single check named `gate`: it passes only when every matrix leg
  # succeeded. `always()` makes it report failure, not skip, when a leg fails
  # or is cancelled.
  gate:
    needs: python
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every matrix leg to succeed
        env:
          RESULT: ${{ needs.python.result }}
        run: |
          echo "python matrix: $RESULT"
          test "$RESULT" = success
